
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyShop - Online Shopping</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #222;
    }
    header {
      background: #0875e1;
      color: white;
      padding: 18px 5%;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
    }
    .logo { font-size: 27px; font-weight: bold; }
    #search {
      padding: 12px;
      border: 0;
      border-radius: 8px;
      width: min(100%, 350px);
      font-size: 16px;
    }
    .hero {
      text-align: center;
      padding: 45px 15px;
      background: #dcecff;
    }
    .hero h1 { color: #0759b5; }
    main { max-width: 1100px; margin: auto; padding: 20px; }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
      gap: 16px;
    }
    .product, .cart {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000010;
    }
    .product img {
      width: 100%;
      height: 145px;
      object-fit: contain;
      border-radius: 8px;
    }
    .product h3 { font-size: 17px; }
    .price { color: #d71920; font-weight: bold; }
    button {
      background: #0875e1;
      color: white;
      padding: 10px 12px;
      border: 0;
      border-radius: 7px;
      cursor: pointer;
      margin: 3px 0;
    }
    button:hover { background: #0759b5; }
    .product button { width: 100%; }
    .cart { margin-top: 25px; }
    .cart-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #eee;
      padding: 12px 0;
      flex-wrap: wrap;
    }
    .remove { background: #d71920; }
    .checkout {
      background: #16a34a;
      width: 100%;
      padding: 14px;
      font-size: 16px;
      margin-top: 12px;
    }
    footer {
      text-align: center;
      padding: 22px;
      background: #172334;
      color: white;
      margin-top: 25px;
    }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <div class="logo">MyShop 🛍️</div>
      <input id="search" placeholder="प्रोडक्ट खोजें..."
             oninput="showProducts()">
      <div>🛒 कार्ट: <span id="count">0</span></div>
    </div>
  </header>

  <section class="hero">
    <h1>आपकी पसंद, आपकी शॉपिंग!</h1>
    <p>अच्छे प्रोडक्ट, शानदार कीमतें</p>
    <button onclick="document.getElementById('shop').scrollIntoView()">
      अभी खरीदारी करें
    </button>
  </section>

  <main>
    <h2 id="shop">हमारे प्रोडक्ट</h2>
    <div class="products" id="products"></div>

    <section class="cart">
      <h2>आपका शॉपिंग कार्ट 🛒</h2>
      <div id="cartItems">आपका कार्ट अभी खाली है।</div>
      <h3>कुल राशि: ₹<span id="total">0</span></h3>
      <button class="checkout" onclick="checkout()">
        WhatsApp पर ऑर्डर करें
      </button>
      <p style="font-size:13px;color:#666">
        ऑर्डर भेजने से पहले WhatsApp पर जानकारी जाँचें।
      </p>
    </section>
  </main>

  <footer>
    © 2026 MyShop | ऑनलाइन शॉपिंग वेबसाइट
  </footer>

  <script>
    const products = [
      {id:1, name:"वायरलेस हेडफोन", price:1299,
       image:"https://placehold.co/300x200?text=Headphones"},
      {id:2, name:"स्मार्ट वॉच", price:1999,
       image:"https://placehold.co/300x200?text=Smart+Watch"},
      {id:3, name:"स्पोर्ट्स शूज़", price:1499,
       image:"https://placehold.co/300x200?text=Shoes"},
      {id:4, name:"बैकपैक बैग", price:899,
       image:"https://placehold.co/300x200?text=Backpack"},
      {id:5, name:"मोबाइल फोन", price:9999,
       image:"https://placehold.co/300x200?text=Mobile"},
      {id:6, name:"सनग्लासेस", price:499,
       image:"https://placehold.co/300x200?text=Sunglasses"}
    ];

    let cart = [];

    function showProducts() {
      const query = document.getElementById("search").value.toLowerCase();
      const filtered = products.filter(p =>
        p.name.toLowerCase().includes(query)
      );

      document.getElementById("products").innerHTML =
        filtered.map(p => `
          <article class="product">
            <img src="${p.image}" alt="${p.name}">
            <h3>${p.name}</h3>
            <p class="price">₹${p.price.toLocaleString("en-IN")}</p>
            <button onclick="addToCart(${p.id})">
              कार्ट में जोड़ें
            </button>
          </article>
        `).join("") || "<p>कोई प्रोडक्ट नहीं मिला।</p>";
    }

    function addToCart(id) {
      const item = cart.find(p => p.id === id);
      if (item) {
        item.qty++;
      } else {
        const product = products.find(p => p.id === id);
        cart.push({...product, qty:1});
      }
      updateCart();
    }

    function changeQty(id, amount) {
      const item = cart.find(p => p.id === id);
      if (!item) return;
      item.qty += amount;
      if (item.qty <= 0) {
        cart = cart.filter(p => p.id !== id);
      }
      updateCart();
    }

    function updateCart() {
      const count = cart.reduce((sum, p) => sum + p.qty, 0);
      const total = cart.reduce((sum, p) => sum + p.price * p.qty, 0);

      document.getElementById("count").textContent = count;
      document.getElementById("total").textContent =
        total.toLocaleString("en-IN");

      document.getElementById("cartItems").innerHTML = cart.length
        ? cart.map(p => `
          <div class="cart-row">
            <span>${p.name} — ₹${p.price.toLocaleString("en-IN")}</span>
            <span>
              <button onclick="changeQty(${p.id},-1)">−</button>
              ${p.qty}
              <button onclick="changeQty(${p.id},1)">+</button>
              <button class="remove"
                onclick="changeQty(${p.id},-${p.qty})">हटाएँ</button>
            </span>
          </div>
        `).join("")
        : "आपका कार्ट अभी खाली है।";
    }

    function checkout() {
      if (!cart.length) {
        alert("पहले कार्ट में प्रोडक्ट जोड़ें।");
        return;
      }

      const lines = cart.map(p =>
        `${p.name} x ${p.qty} = ₹${p.price * p.qty}`
      ).join("\n");

      const total = cart.reduce((sum, p) => sum + p.price * p.qty, 0);

      const message =
        `नमस्ते! मुझे ऑर्डर करना है:\n${lines}\nकुल: ₹${total}`;

      // नीचे 91 के बाद अपना 10 अंकों वाला WhatsApp नंबर डालें।
      const phone = "91XXXXXXXXXX";

      if (phone.includes("X")) {
        alert("पहले कोड में अपना WhatsApp नंबर डालें।");
        return;
      }

      window.open(
        "https://wa.me/" + phone + "?text=" +
        encodeURIComponent(message),
        "_blank"
      );
    }

    showProducts();
  </script>
</body>
</html>
