
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Online Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f3f5f9;
      color: #222;
    }
    header {
      background: #0875e1;
      color: white;
      padding: 20px;
      text-align: center;
    }
    #search {
      padding: 12px;
      width: 80%;
      max-width: 400px;
      border: 0;
      border-radius: 8px;
      margin-top: 12px;
    }
    h2 { text-align: center; }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      padding: 20px;
    }
    .product {
      background: white;
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 2px 8px #ddd;
    }
    .product img {
      width: 100%;
      height: 150px;
      object-fit: contain;
    }
    .price {
      color: #d71920;
      font-weight: bold;
    }
    button {
      background: #0875e1;
      color: white;
      border: 0;
      padding: 10px 15px;
      border-radius: 7px;
      cursor: pointer;
    }
    .cart {
      margin: 20px;
      padding: 20px;
      background: white;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🛍️ My Online Store</h1>
    <p>आपकी पसंद, आपकी शॉपिंग!</p>
    <input id="search" placeholder="प्रोडक्ट खोजें..."
           oninput="showProducts()">
  </header>

  <h2>हमारे प्रोडक्ट</h2>
  <div class="products" id="products"></div>

  <section class="cart">
    <h2>आपका कार्ट 🛒</h2>
    <div id="cart">कार्ट खाली है।</div>
    <h3>कुल: ₹<span id="total">0</span></h3>
    <button onclick="order()">WhatsApp पर ऑर्डर करें</button>
  </section>

  <script>
    const items = [
      {name:"हेडफोन",price:299,
       https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=400&q=80
      {name:"स्मार्ट वॉच",price:299,
       https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=400&q=80
      {name:"जूते",price:499,
       https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=400&q=80
      {name:"बैग",price:899,
       image:"https://placehold.co/300x200?text=Bag"},
      {name:"मोबाइल",price:9999,
       image:"https://placehold.co/300x200?text=Mobile"},
      {name:"सनग्लासेस",price:499,
       image:"https://placehold.co/300x200?text=Sunglasses"}
    ];

    let cart = [];

    function showProducts() {
      const q = document.getElementById("search").value.toLowerCase();
      const filtered = items.filter(p => p.name.toLowerCase().includes(q));
      document.getElementById("products").innerHTML = filtered.map((p,i) => `
        <div class="product">
          <img src="${p.image}" alt="${p.name}">
          <h3>${p.name}</h3>
          <p class="price">₹${p.price.toLocaleString("en-IN")}</p>
          <button onclick="add(${items.indexOf(p)})">कार्ट में जोड़ें</button>
        </div>
      `).join("") || "<p>कोई प्रोडक्ट नहीं मिला।</p>";
    }

    function add(i) {
      cart.push(items[i]);
      updateCart();
    }

    function updateCart() {
      document.getElementById("cart").innerHTML = cart.length
        ? cart.map((p,i) => `
          <p>${p.name} - ₹${p.price}
          <button onclick="removeItem(${i})">हटाएँ</button></p>
        `).join("")
        : "कार्ट खाली है।";
      document.getElementById("total").textContent =
        cart.reduce((sum,p) => sum+p.price,0).toLocaleString("en-IN");
    }

    function removeItem(i) {
      cart.splice(i,1);
      updateCart();
    }

    function order() {
      if (!cart.length) {
        alert("पहले कार्ट में प्रोडक्ट जोड़ें।");
        return;
      }
      const msg = "नमस्ते, मुझे ये प्रोडक्ट ऑर्डर करने हैं:\n" +
        cart.map(p => p.name + " - ₹" + p.price).join("\n") +
        "\nकुल: ₹" + cart.reduce((s,p)=>s+p.price,0);
      // अपना WhatsApp नंबर नीचे डालें।
      const phone = "91XXXXXXXXXX";
      if (phone.includes("X")) {
        alert("कोड में अपना WhatsApp नंबर डालें।");
        return;
      }
      window.open("https://wa.me/" + phone + "?text=" +
        encodeURIComponent(msg), "_blank");
    }

    showProducts();
  </script>
</body>
</html>
